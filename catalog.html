<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог площадок и агентств — ad-catalog-ru.ru</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            line-height: 1.6;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            color: #222;
        }
        h1 { margin-bottom: 0.5rem; }
        .controls {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 2rem;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .controls select {
            padding: 8px;
            font-size: 1rem;
            border-radius: 4px;
            border: 1px solid #ccc;
            min-width: 200px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 1rem;
            border-bottom: 2px solid #eee;
        }
        .tab-btn {
            padding: 10px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            color: #666;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }
        .tab-btn.active {
            color: #005bbb;
            border-bottom-color: #005bbb;
            font-weight: bold;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            background: #fff;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .card h3 { margin-top: 0; font-size: 1.2rem; }
        .card .status {
            font-size: 0.85rem;
            color: #2e7d32;
            background: #e8f5e9;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 10px;
        }
        .card p { margin: 5px 0; font-size: 0.9rem; }
        .card .url { font-size: 0.85rem; color: #666; word-break: break-all; }
        .card .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 16px;
            background: #005bbb;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        
        /* Всплывающая подсказка при наведении */
        .card .tooltip {
            visibility: hidden;
            width: 220px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 10px;
            position: absolute;
            z-index: 1;
            bottom: 100%;
            left: 50%;
            margin-left: -110px;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 0.8rem;
            line-height: 1.4;
        }
        .card:hover .tooltip {
            visibility: visible;
            opacity: 1;
        }
        
        .back-link {
            display: inline-block;
            margin-bottom: 1.5rem;
            color: #005bbb;
            text-decoration: none;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">← Назад на главную</a>
    
    <h1>Каталог площадок и агентств</h1>
    <p>Выберите область и город, чтобы увидеть доступные площадки и агентства.</p>

    <!-- Панель управления (дерево) -->
    <div class="controls">
        <div>
            <label for="regionSelect">Область:</label><br>
            <select id="regionSelect"></select>
        </div>
        <div>
            <label for="citySelect">Город:</label><br>
            <select id="citySelect" disabled></select>
        </div>
    </div>

    <!-- Вкладки (Агентства / Площадки) -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('platforms')">Площадки (Реклама)</button>
        <button class="tab-btn" onclick="switchTab('agencies')">Агентства (Маркетологи)</button>
    </div>

    <!-- Контейнер для карточек -->
    <div id="cardsContainer" class="grid"></div>

    <script>
        let currentData = null;
        let currentCity = "";
        let currentTab = "platforms"; // platforms или agencies

        // Загружаем данные из JSON-файла
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                currentData = data;
                initRegionSelect();
            })
            .catch(error => console.error('Ошибка загрузки данных:', error));

        // Инициализация выпадающего списка Областей
        function initRegionSelect() {
            const regionSelect = document.getElementById('regionSelect');
            regionSelect.innerHTML = '';
            
            for (const region in currentData) {
                const option = document.createElement('option');
                option.value = region;
                option.textContent = region;
                regionSelect.appendChild(option);
            }
            
            // Обработчик выбора области
            regionSelect.addEventListener('change', function() {
                updateCitySelect(this.value);
            });
            
            // Запускаем для первой области по умолчанию
            updateCitySelect(regionSelect.value);
        }

        // Обновление списка Городов при выборе области
        function updateCitySelect(region) {
            const citySelect = document.getElementById('citySelect');
            citySelect.innerHTML = '';
            
            if (!currentData[region]) return;
            
            for (const city in currentData[region]) {
                const option = document.createElement('option');
                option.value = city;
                option.textContent = city;
                citySelect.appendChild(option);
            }
            
            citySelect.disabled = false;
            
            // Обработчик выбора города
            citySelect.addEventListener('change', function() {
                currentCity = this.value;
                renderCards();
            });
            
            // Если город уже выбран, обновляем карточки
            currentCity = citySelect.value;
            renderCards();
        }

        // Переключение вкладок (Площадки / Агентства)
        function switchTab(tab) {
            currentTab = tab;
            
            // Меняем активный класс у кнопок
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            renderCards();
        }

        // Отрисовка карточек
        function renderCards() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';
            
            const region = document.getElementById('regionSelect').value;
            
            if (!currentData[region] || !currentData[region][currentCity]) {
                container.innerHTML = '<p>Нет данных для выбранного города.</p>';
                return;
            }
            
            const items = currentData[region][currentCity][currentTab] || [];
            
            if (items.length === 0) {
                container.innerHTML = '<p>Пока нет данных в этой категории для выбранного города.</p>';
                return;
            }
            
            items.forEach(item => {
                // Формируем карточку
                const card = document.createElement('div');
                card.className = 'card';
                
                // Всплывающая подсказка (описание)
                const tooltip = document.createElement('div');
                tooltip.className = 'tooltip';
                tooltip.innerHTML = `<strong>${item.name}</strong><br>${item.type || 'Площадка'}<br>Статус: ${item.status}`;
                card.appendChild(tooltip);
                
                // Заголовок
                const h3 = document.createElement('h3');
                h3.textContent = item.name;
                card.appendChild(h3);
                
                // Статус
                const status = document.createElement('span');
                status.className = 'status';
                status.textContent = item.status === 'Проверено' ? '✔ Проверено' : 'На проверке';
                card.appendChild(status);
                
                // Тип
                if (item.type) {
                    const typeP = document.createElement('p');
                    typeP.innerHTML = `<strong>Тип:</strong> ${item.type}`;
                    card.appendChild(typeP);
                }
                
                // Ссылка
                if (item.url) {
                    const urlP = document.createElement('p');
                    urlP.className = 'url';
                    urlP.textContent = item.url.replace('https://', '');
                    card.appendChild(urlP);
                }
                
                // Кнопка перехода (если есть ссылка)
                if (item.url) {
                    const btn = document.createElement('a');
                    btn.className = 'btn';
                    btn.href = `${item.url}?utm_source=ad-catalog-ru&utm_medium=catalog&utm_campaign=${item.utm || 'unknown'}`;
                    btn.target = '_blank';
                    btn.textContent = 'Перейти на сайт';
                    card.appendChild(btn);
                }
                
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
