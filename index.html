        /* Мобильная адаптация */

            .header-text h1 { font-size: 1.6rem; }

            .controls { padding: 15px; }
            .controls-row-1 { flex-direction: column; gap: 12px; }

<body>

    <div class="header">
        <div class="header-text">
            <h1 id="ui-header-h1">Загрузка...</h1>
            <p class="subtitle" id="ui-header-subtitle"></p>
        </div>
        <div>
            <a href="#form-anchor" class="btn" id="ui-header-btn">Оставить заявку</a>
        </div>
    </div>

    <div class="benefits">
        <h2 id="ui-benefits-title">Что вы получаете бесплатно</h2>
        <ul id="ui-benefits-list"></ul>
        <a href="about.html" class="benefits-link">🚀 Узнать о Premium-версии и полной аналитике →</a>
    </div>

    <h2 id="ui-catalog-title">Доступные площадки и агентства</h2>
    
    <div class="controls">
        <div class="controls-row-1">
            <div class="control-group">
                <label for="regionSelect">Область:</label>
                <select id="regionSelect"><option>Загрузка...</option></select>
            </div>
            <div class="control-group">
                <label for="citySelect">Город:</label>
                <select id="citySelect" disabled><option>Сначала выберите область</option></select>
            </div>
        </div>
        <div class="controls-row-2">
            <label for="searchInput" id="ui-search-label">Поиск услуг или площадок:</label>
            <input type="text" id="searchInput" placeholder="Например: табличка с адресом, SEO, газета...">
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="btn-platforms">Площадки (Реклама)</button>
        <button class="tab-btn" id="btn-agencies">Агентства (Маркетологи)</button>
    </div>

    <div id="cardsContainer" class="grid"></div>

    <div id="form-anchor"></div>
    <h2 id="ui-form-title" style="text-align: center; margin: 40px 0 20px;">Оставить заявку на размещение</h2>
    
    <div class="form-container">
        <iframe id="ui-form-iframe" frameborder="0" marginheight="0" marginwidth="0" title="Форма заявки">Загрузка формы…</iframe>
    </div>
    
    <p id="ui-form-disclaimer" style="font-size: 0.9rem; color: #666; margin-top: 1rem; text-align: center;"></p>

    <script>
        let DB = null;
        let CFG = null;
        let currentTab = 'platforms';
        let searchQuery = '';

        function initApp() {
            console.log('🚀 Запуск AD Catalog...');
            
            // 1. Загружаем list.json и чистим его от возможных ошибок (лишних запятых)
            fetch('data/list.json')
                .then(res => {
                    if (!res.ok) throw new Error('list.json не найден');
                    return res.text(); 
                })
                .then(text => {
                    // Убираем trailing commas (запятые перед ] или }), чтобы JSON стал валидным
                    const cleanJson = text.replace(/,\s*([\]}])/g, '$1');
                    try {
                        const fileList = JSON.parse(cleanJson);
                        console.log('✅ list.json загружен. Файлов:', fileList.length);
                        loadAllData(fileList);
                    } catch (e) {
                        console.error('❌ Не удалось распарсить list.json:', e);
                        throw e;
                    }
                })
                .catch(err => {
                    console.error("Критическая ошибка list.json:", err);
                    // Если list.json не грузится, пробуем запасной вариант (хардкод)
                    console.warn('⚠️ Переход на резервный список файлов');
                    loadAllData([
                        "data.json",
  "data_moskovskaya_oblast.json",
  "data_tulskaya_oblast.json",
  "data_kaluzhskaya_oblast.json",
  "data_ryazanskaya_oblast.json",
  "data_yaroslavskaya_oblast.json",
  "data_kostromskaya_oblast.json",
  "data_ivanovskaya_oblast.json",
  "data_bryanskaya_oblast.json",
  "data_krasnodarskiy_kray.json",
  "data_rostovskaya_oblast.json",
  "data_stavropolskiy_kray.json",
  "data_astrahanskaya_oblast.json",
  "data_volgogradskaya_oblast.json",
  "data_republika_krym.json",
  "data_sevastopol.json",
  "data_republika_adygeya.json",
  "data_tambovskaya_oblast.json",
  "data_orlovskaya_oblast.json",
  "data_lipetskaya_oblast.json",
  "data_kurskaya_oblast.json",
  "data_smolenskaya_oblast.json",
  "data_moskva.json",
  "data_belgorodskaya_oblast.json",
  "data_tverskaya_oblast.json",
  "data_voronezhskaya_oblast.json",
  "data_republika_tatarstan.json",
  "data_leningradskaya_oblast.json"
                    ]);
                });
        }

        function loadAllData(fileList) {
            // 2. Создаем запросы ко всем файлам из списка
            const dataPromises = fileList.map(fileName => {
                // ЗАЩИТА ОТ ДВОЙНОЙ ПАПКИ: убираем "data/" если оно есть в имени файла
                const cleanName = fileName.replace(/^data\//i, '');
                
                return fetch(`data/${cleanName}`)
                    .then(r => {
                        if (!r.ok) {
                            console.warn(`⚠️ Файл ${cleanName} не найден (404), пропускаем.`);
                            return null;
                        }
                        return r.json();
                    })
                    .catch(e => {
                        console.error(`❌ Ошибка чтения ${cleanName}:`, e);
                        return null;
                    })
            });

            // 3. Параллельно грузим конфиг
            Promise.all([
                fetch('config.json').then(r => r.ok ? r.json() : null).catch(() => null),
                ...dataPromises
            ]).then(results => {
                // Обработка конфига
                const rawConfig = results[0];
                CFG = (rawConfig && rawConfig.site) ? rawConfig.site : rawConfig;
                
                // Сборка базы данных
                DB = {}; 
                let loadedCount = 0;

                for (let i = 1; i < results.length; i++) {
                    if (results[i]) {
                        Object.assign(DB, results[i]);
                        loadedCount++;
                    }
                }

                console.log(`✅ База данных собрана. Регионов: ${loadedCount}`);

                // Очистка от карточек без URL
                if (DB) {
                    for (let region in DB) {
                        for (let city in DB[region]) {
                            if (DB[region][city].platforms) {
                                DB[region][city].platforms = DB[region][city].platforms.filter(p => p.url && p.url.trim() !== '');
                            }
                            if (DB[region][city].agencies) {
                                DB[region][city].agencies = DB[region][city].agencies.filter(a => a.url && a.url.trim() !== '');
                            }
                        }
                    }
                }

                // Инициализация интерфейса
                if (CFG) applyConfig();
                else {
                    document.getElementById('ui-header-h1').textContent = "Каталог рекламных площадок";
                    document.getElementById('ui-header-subtitle').textContent = "Бесплатный тест";
                }
                
                initFilters();
                render();
            });
        }

        function applyConfig() {
            if (!CFG) return;
            document.title = CFG.title || "Каталог";
            document.getElementById('page-desc').content = CFG.description || "";
            
            if (CFG.header) {
                document.getElementById('ui-header-h1').textContent = CFG.header.h1;
                document.getElementById('ui-header-subtitle').textContent = CFG.header.subtitle;
                document.getElementById('ui-header-btn').textContent = CFG.header.ctaButton;
            }
            
            if (CFG.benefits) {
                document.getElementById('ui-benefits-title').textContent = CFG.benefits.title;
                const benList = document.getElementById('ui-benefits-list');
                benList.innerHTML = '';
                if (CFG.benefits.items) CFG.benefits.items.forEach(item => {
                    const li = document.createElement('li');
                    li.textContent = item;
                    benList.appendChild(li);
                });
            }
            
            if (CFG.catalog) {
                document.getElementById('ui-catalog-title').textContent = CFG.catalog.title;
                document.getElementById('searchInput').placeholder = CFG.catalog.searchPlaceholder;
                if (CFG.catalog.tabs) {
                    document.getElementById('btn-platforms').textContent = CFG.catalog.tabs.platforms;
                    document.getElementById('btn-agencies').textContent = CFG.catalog.tabs.agencies;
                }
            }
            
            if (CFG.form) {
                document.getElementById('ui-form-title').textContent = CFG.form.title;
                document.getElementById('ui-form-iframe').src = CFG.form.url;
                document.getElementById('ui-form-disclaimer').textContent = CFG.form.disclaimer;
            }
        }

        function initFilters() {
            const regSel = document.getElementById('regionSelect');
            const citySel = document.getElementById('citySelect');
            regSel.innerHTML = '<option value="">🔍 Все области</option>';
            citySel.innerHTML = '<option value="">🔍 Все города</option>';
            
            if (DB) {
                for (let region in DB) {
                    let opt = document.createElement('option');
                    opt.value = region; opt.textContent = region;
                    regSel.appendChild(opt);
                }
            }

            regSel.onchange = function() { updateCities(regSel.value); render(); };
            citySel.onchange = function() { render(); };
            document.getElementById('searchInput').oninput = function(e) { searchQuery = e.target.value.toLowerCase().trim(); render(); };
            
            document.getElementById('btn-platforms').onclick = () => setTab('platforms');
            document.getElementById('btn-agencies').onclick = () => setTab('agencies');
        }

        function updateCities(region) {
            const citySel = document.getElementById('citySelect');
            citySel.innerHTML = '<option value="">🔍 Все города</option>';
            if (!region || !DB || !DB[region]) { citySel.disabled = true; render(); return; }
            citySel.disabled = false;
            for (let city in DB[region]) {
                let opt = document.createElement('option');
                opt.value = city; opt.textContent = city;
                citySel.appendChild(opt);
            }
            render();
        }

        function setTab(tab) {
            currentTab = tab;
            document.getElementById('btn-platforms').classList.toggle('active', tab === 'platforms');
            document.getElementById('btn-agencies').classList.toggle('active', tab === 'agencies');
            render();
        }

        function render() {
            const container = document.getElementById('cardsContainer');
            if (!container) return;
            container.innerHTML = '';
            
            const region = document.getElementById('regionSelect').value;
            const city = document.getElementById('citySelect').value;
            let items = [];

            // ЛОГИКА СБОРА ДАННЫХ
            if (searchQuery) {
                // При поиске ищем ВСЕГДА везде
                if (DB) {
                    for (let r in DB) {
                        for (let c in DB[r]) {
                            if (DB[r][c].platforms) DB[r][c].platforms.forEach(i => items.push({...i, _r: r, _c: c, _t: 'platforms'}));
                            if (DB[r][c].agencies) DB[r][c].agencies.forEach(i => items.push({...i, _r: r, _c: c, _t: 'agencies'}));
                        }
                    }
                }
            } else {
                // Обычный режим
                if (DB && region && DB[region]) {
                    let citiesToCheck = city ? [city] : Object.keys(DB[region]);
                    citiesToCheck.forEach(c => {
                        const cityData = DB[region][c];
                        if (cityData && cityData[currentTab]) {
                            cityData[currentTab].forEach(i => items.push({...i, _r: region, _c: c}));
                        }
                    });
                } else if (DB && !region) {
                    for (let r in DB) {
                        for (let c in DB[r]) {
                            if (DB[r][c][currentTab]) DB[r][c][currentTab].forEach(i => items.push({...i, _r: r, _c: c}));
                        }
                    }
                }
            }

            // Фильтрация поиска
            if (searchQuery && items.length > 0) {
                items = items.filter(i => {
                    let text = ((i.specialization || '') + ' ' + (i.name || '') + ' ' + (i.type || '') + ' ' + (i._c || '')).toLowerCase();
                    return text.includes(searchQuery);
                });
                
                if (items.length > 0 && items[0]._t !== currentTab) {
                    setTab(items[0]._t);
                    return;
                }
            }

            // Рендер карточек или сообщения
            if (items.length === 0) {
                let msg = searchQuery ? `Ничего не найдено по запросу "${searchQuery}"` : 'В выбранном городе нет данных для этой категории';
                
                if (!searchQuery && city && region && DB[region][city]) {
                    const otherTab = currentTab === 'platforms' ? 'agencies' : 'platforms';
                    if (DB[region][city][otherTab] && DB[region][city][otherTab].length > 0) {
                        msg += `. Но есть данные в разделе "${otherTab === 'platforms' ? 'Площадки' : 'Агентства'}".`;
                    }
                }
                
                container.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #666; padding: 20px;">${msg}</p>`;
                return;
            }

            items.forEach(item => {
                let card = document.createElement('div');
                card.className = 'card';
                
                let locHtml = (!city || searchQuery) ? `<span class="location-tag">📍 ${item._r}, ${item._c}</span>` : '';
                let specHtml = item.specialization ? `<div class="specialization">💼 ${item.specialization}</div>` : '';
                
                let contactsHtml = '';
                if (item.email) contactsHtml += `<div>✉️ ${item.email}</div>`;
                if (item.phone) contactsHtml += `<div>📞 ${item.phone}</div>`;
                
                let btnHtml = item.url 
                    ? `<a href="${item.url}?utm_source=ad-catalog-ru&utm_medium=catalog&utm_campaign=${item.utm||'catalog'}" target="_blank" class="btn-card" onclick="ym(114270099,'reachGoal','click_site')">Перейти на сайт</a>` 
                    : `<div style="color:#999; font-size:0.85rem; margin-top:auto; text-align:center;">Сайт не указан</div>`;

                card.innerHTML = `
                    ${locHtml}
                    <h3>${item.name}</h3>
                    <span class="status">${item.status || 'На проверке'}</span>
                    ${specHtml}
                    <div class="contacts">
                        <div><strong>Тип:</strong> ${item.type||'-'}</div>
                        ${contactsHtml}
                    </div>
                    ${btnHtml}
                `;
                container.appendChild(card);
            });
        }

        // Запуск приложения
        initApp();
    </script>
</body>
</html>
