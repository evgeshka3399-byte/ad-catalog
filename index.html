<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AD Catalog - Каталог рекламных площадок</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .filters {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .filter-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        select, input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }

        select:focus, input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input[type="text"]::placeholder {
            color: #999;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            background: #f0f0f0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 1.3em;
            font-weight: 700;
            color: #333;
            margin-bottom: 5px;
        }

        .card-type {
            display: inline-block;
            padding: 5px 12px;
            background: #667eea;
            color: white;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
            margin-top: 5px;
        }

        .status-verified {
            background: #d4edda;
            color: #155724;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .card-specialization {
            color: #666;
            font-size: 0.95em;
            margin: 10px 0;
            line-height: 1.5;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 3px solid #667eea;
        }

        .card-info {
            margin: 10px 0;
            font-size: 0.9em;
            color: #555;
        }

        .card-info strong {
            color: #333;
        }

        .card-actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: scale(1.05);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: white;
            font-size: 1.2em;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .cards-container {
                grid-template-columns: 1fr;
            }

            .filter-row {
                flex-direction: column;
            }

            .tabs {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📢 AD Catalog</h1>
            <p class="subtitle">Каталог проверенных рекламных площадок и агентств Владимирской области</p>
        </header>

        <div class="filters">
            <div class="filter-row">
                <select id="regionSelect">
                    <option value="">Выберите область</option>
                </select>
                <select id="citySelect" disabled>
                    <option value="">Сначала выберите область</option>
                </select>
            </div>
            
            <div class="filter-row">
                <input type="text" id="searchInput" placeholder="Какой вид услуг вас интересует? Например: SEO, SMM, наружная реклама...">
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('platforms', event)">🏢 Площадки</button>
                <button class="tab-btn" onclick="switchTab('agencies', event)">🎯 Агентства</button>
            </div>
        </div>

        <div id="cardsContainer" class="cards-container">
            <div class="no-results">
                Выберите область и город для просмотра каталога
            </div>
        </div>
    </div>

    <!-- Яндекс.Метрика -->
    <script type="text/javascript" >
       (function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
       m[i].l=1*new Date();k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})
       (window, document, "script", "https://mc.yandex.ru/metrika/tag.js", "ym");

       ym(114270099, "init", {
            clickmap:true,
            trackLinks:true,
            accurateTrackBounce:true,
            webvisor:true
       });
    </script>

    <script>
        let currentData = null;
        let currentCity = "";
        let currentTab = "platforms";
        let searchQuery = "";

        // Загрузка данных
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                currentData = data;
                initRegionSelect();
            })
            .catch(error => {
                console.error('Ошибка загрузки данных:', error);
                document.getElementById('cardsContainer').innerHTML = 
                    '<div class="no-results">Ошибка загрузки данных. Попробуйте обновить страницу.</div>';
            });

        function initRegionSelect() {
            const regionSelect = document.getElementById('regionSelect');
            regionSelect.innerHTML = '<option value="">Выберите область</option>';
            
            for (const region in currentData) {
                const option = document.createElement('option');
                option.value = region;
                option.textContent = region;
                regionSelect.appendChild(option);
            }
            
            regionSelect.addEventListener('change', function() {
                updateCitySelect(this.value);
            });
        }

        function updateCitySelect(region) {
            const citySelect = document.getElementById('citySelect');
            citySelect.innerHTML = '<option value="">Выберите город</option>';
            
            if (!region || !currentData[region]) {
                citySelect.disabled = true;
                return;
            }
            
            for (const city in currentData[region]) {
                const option = document.createElement('option');
                option.value = city;
                option.textContent = city;
                citySelect.appendChild(option);
            }
            
            citySelect.disabled = false;
            citySelect.addEventListener('change', function() {
                currentCity = this.value;
                renderCards();
            });
        }

        function switchTab(tab, event) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if(event) event.target.classList.add('active');
            renderCards();
        }

        // Поиск по специализации
        document.getElementById('searchInput').addEventListener('input', function(e) {
            searchQuery = e.target.value.toLowerCase().trim();
            renderCards();
        });

        function renderCards() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';
            
            const region = document.getElementById('regionSelect').value;
            
            if (!region || !currentCity) {
                container.innerHTML = '<div class="no-results">Выберите область и город для просмотра каталога</div>';
                return;
            }
            
            if (!currentData[region] || !currentData[region][currentCity]) {
                container.innerHTML = '<div class="no-results">Нет данных для выбранного города.</div>';
                return;
            }
            
            let items = currentData[region][currentCity][currentTab] || [];
            
            // Фильтрация по поисковому запросу
            if (searchQuery) {
                items = items.filter(item => {
                    const spec = (item.specialization || '').toLowerCase();
                    const name = (item.name || '').toLowerCase();
                    const type = (item.type || '').toLowerCase();
                    return spec.includes(searchQuery) || name.includes(searchQuery) || type.includes(searchQuery);
                });
            }
            
            if (items.length === 0) {
                container.innerHTML = '<div class="no-results">' + 
                    (searchQuery ? 'Ничего не найдено по вашему запросу' : 'Пока нет данных в этой категории для выбранного города.') + 
                    '</div>';
                return;
            }
            
            items.forEach(item => {
                const card = createCard(item);
                container.appendChild(card);
            });
        }

        function createCard(item) {
            const card = document.createElement('div');
            card.className = 'card';
            
            const isPlatform = currentTab === 'platforms';
            const statusClass = item.status === 'Проверено' ? 'status-verified' : 'status-pending';
            
            let infoHtml = '';
            if (isPlatform) {
                if (item.email) {
                    infoHtml += `<div class="card-info"><strong>📧 Email:</strong> ${item.email}</div>`;
                }
                if (item.phone) {
                    infoHtml += `<div class="card-info"><strong>📞 Телефон:</strong> ${item.phone}</div>`;
                }
                if (item.reklama_phone) {
                    infoHtml += `<div class="card-info"><strong>📱 Отдел рекламы:</strong> ${item.reklama_phone}</div>`;
                }
            } else {
                if (item.email) {
                    infoHtml += `<div class="card-info"><strong>📧 Email:</strong> ${item.email}</div>`;
                }
                if (item.phone) {
                    infoHtml += `<div class="card-info"><strong>📞 Телефон:</strong> ${item.phone}</div>`;
                }
            }
            
            const specializationHtml = item.specialization ? 
                `<div class="card-specialization">💼 ${item.specialization}</div>` : '';
            
            const url = item.url || '#';
            const utmParam = isPlatform && item.utm ? `?utm_source=ad_catalog&utm_medium=referral&utm_campaign=${item.utm}` : '';
            
            card.innerHTML = `
                <div class="card-header">
                    <div>
                        <div class="card-title">${item.name}</div>
                        <span class="card-type">${item.type || 'Информация недоступна'}</span>
                        <br>
                        <span class="status-badge ${statusClass}">${item.status}</span>
                    </div>
                </div>
                
                ${specializationHtml}
                ${infoHtml}
                
                <div class="card-actions">
                    ${url !== '#' ? `<a href="${url}${utmParam}" target="_blank" class="btn btn-primary" onclick="trackClick('${item.name}')">Перейти на сайт</a>` : ''}
                    <button class="btn btn-secondary" onclick="copyContact('${item.email || item.phone || ''}')">Копировать контакт</button>
                </div>
            `;
            
            return card;
        }

        function trackClick(itemName) {
            if (typeof ym !== 'undefined') {
                ym(114270099, 'reachGoal', 'click_site', {'item_name': itemName});
            }
        }

        function copyContact(contact) {
            if (!contact) {
                alert('Контактная информация отсутствует');
                return;
            }
            
            navigator.clipboard.writeText(contact).then(() => {
                alert('Контакт скопирован: ' + contact);
            }).catch(err => {
                console.error('Ошибка копирования:', err);
                prompt('Скопируйте контакт:', contact);
            });
        }
    </script>
</body>
</html>
