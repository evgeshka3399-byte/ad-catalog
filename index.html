        /* FAQ */

<body>

    <div class="header">
        <div class="header-text">
            <h1 id="ui-header-h1">Загрузка...</h1>
            <p class="subtitle" id="ui-header-subtitle"></p>
        </div>
        <div>
            <a href="#form-anchor" class="btn" id="ui-header-btn"></a>
        </div>
    </div>

    <div class="benefits">
        <h2 id="ui-benefits-title"></h2>
        <ul id="ui-benefits-list"></ul>
    </div>

    <h2 id="ui-catalog-title"></h2>
    
    <div class="controls">
        <div class="controls-row-1">
            <div class="control-group">
                <label for="regionSelect">Область:</label>
                <select id="regionSelect"><option>Загрузка...</option></select>
            </div>
            <div class="control-group">
                <label for="citySelect">Город:</label>
                <select id="citySelect" disabled><option>Сначала выберите область</option></select>
            </div>
        </div>
        <div class="controls-row-2">
            <label for="searchInput" id="ui-search-label">Поиск услуг или площадок:</label>
            <input type="text" id="searchInput" placeholder="">
        </div>

    <div class="tabs">
        <button class="tab-btn active" id="btn-platforms"></button>
        <button class="tab-btn" id="btn-agencies"></button>

        <a href="#form-anchor" class="btn" id="ui-cta-btn"></a>
    </div>

        <ul class="contact-list">
            <li>📧 <strong>Почта:</strong> <a id="ui-contact-email" href=""></a></li>
            <li>💬 <strong>MAX:</strong> <a id="ui-contact-messenger" href="" target="_blank"></a></li>
        </ul>
    </div>

    <div id="form-anchor"></div>
    <h2 id="ui-form-title" style="text-align: center; margin-bottom: 20px;"></h2>
    
    <div class="form-container">
        <iframe id="ui-form-iframe" frameborder="0" marginheight="0" marginwidth="0">Загрузка…</iframe>
    </div>
    
    <p id="ui-form-disclaimer" style="font-size: 0.9rem; color: #666; margin-top: 1rem; text-align: center; padding: 0 10px;"></p>

    <script>
        // Глобальные переменные
        let DB = null;
        let CFG = null;
        let currentTab = 'platforms';
        let searchQuery = '';

        // 1. Загрузка конфигов и данных
        Promise.all([
            fetch('config.json').then(r => r.json()),
            fetch('data.json').then(r => r.json())
        ])
        .then(([config, data]) => {
            CFG = config.site;
            DB = data;
            applyConfig();
            initFilters();
            render();
        })
        .catch(err => {
            console.error(err);
            document.body.innerHTML = '<div style="text-align:center; padding:50px; color:red;"><h1>Ошибка загрузки</h1><p>Не удалось загрузить config.json или data.json</p></div>';
        });

        function applyConfig() {
            if (!CFG) return;
            document.title = CFG.title;
            document.getElementById('page-desc').content = CFG.description;
            document.getElementById('ui-header-h1').textContent = CFG.header.h1;
            document.getElementById('ui-header-subtitle').textContent = CFG.header.subtitle;
            document.getElementById('ui-header-btn').textContent = CFG.header.ctaButton;
            document.getElementById('ui-benefits-title').textContent = CFG.benefits.title;
            
            const benList = document.getElementById('ui-benefits-list');
            benList.innerHTML = '';
            CFG.benefits.items.forEach(item => {
                const li = document.createElement('li');
                li.textContent = item;
                benList.appendChild(li);
            });
            
            document.getElementById('ui-catalog-title').textContent = CFG.catalog.title;
            document.getElementById('searchInput').placeholder = CFG.catalog.searchPlaceholder;
            document.getElementById('btn-platforms').textContent = CFG.catalog.tabs.platforms;
            document.getElementById('btn-agencies').textContent = CFG.catalog.tabs.agencies;
            
            document.getElementById('ui-faq-title').textContent = CFG.faq.title;
            const faqCont = document.getElementById('ui-faq-container');
            faqCont.innerHTML = '';
            CFG.faq.items.forEach(qa => {
                const div = document.createElement('div');
                div.className = 'faq-item';
                div.innerHTML = `<h3>${qa.q}</h3><p>${qa.a}</p>`;
                faqCont.appendChild(div);
            });
            
            document.getElementById('ui-contacts-title').textContent = CFG.contacts.title;
            const emailLink = document.getElementById('ui-contact-email');
            emailLink.textContent = CFG.contacts.email;
            emailLink.href = `mailto:${CFG.contacts.email}`;
            const msgLink = document.getElementById('ui-contact-messenger');
            msgLink.textContent = CFG.contacts.messenger;
            msgLink.href = CFG.contacts.messengerLink;
            
            document.getElementById('ui-form-title').textContent = CFG.form.title;
            document.getElementById('ui-form-iframe').src = CFG.form.url;
            document.getElementById('ui-form-disclaimer').textContent = CFG.form.disclaimer;
            document.getElementById('ui-cta-btn').textContent = CFG.header.ctaButton;
        }

        // 2. Логика каталога
        function initFilters() {
            const regSel = document.getElementById('regionSelect');
            const citySel = document.getElementById('citySelect');
            regSel.innerHTML = '<option value="">🔍 Все области</option>';
            citySel.innerHTML = '<option value="">🔍 Все города</option>';
            
            if (DB && typeof DB === 'object') {
                for (let region in DB) {
                    let opt = document.createElement('option');
                    opt.value = region;
                    opt.textContent = region;
                    regSel.appendChild(opt);
                }
            }

            regSel.onchange = function() { updateCities(regSel.value); render(); };
            citySel.onchange = function() { render(); };
            document.getElementById('searchInput').oninput = function(e) { searchQuery = e.target.value.toLowerCase().trim(); render(); };
        }

        function updateCities(region) {
            const citySel = document.getElementById('citySelect');
            citySel.innerHTML = '<option value="">🔍 Все города</option>';
            if (!region || !DB || !DB[region]) { citySel.disabled = true; render(); return; }
            citySel.disabled = false;
            for (let city in DB[region]) {
                let opt = document.createElement('option');
                opt.value = city;
                opt.textContent = city;
                citySel.appendChild(opt);
            }
            render();
        }

        function setTab(tab) {
            currentTab = tab;
            document.getElementById('btn-platforms').classList.toggle('active', tab === 'platforms');
            document.getElementById('btn-agencies').classList.toggle('active', tab === 'agencies');
            render();
        }

        function render() {
            const container = document.getElementById('cardsContainer');
            if (!container) return;
            container.innerHTML = '';
            const region = document.getElementById('regionSelect').value;
            const city = document.getElementById('citySelect').value;
            let items = [];

            if (searchQuery) {
                if (DB) {
                    for (let r in DB) {
                        for (let c in DB[r]) {
                            if (DB[r][c].platforms) DB[r][c].platforms.forEach(i => items.push({...i, _r: r, _c: c, _t: 'platforms'}));
                            if (DB[r][c].agencies) DB[r][c].agencies.forEach(i => items.push({...i, _r: r, _c: c, _t: 'agencies'}));
                        }
                    }
                }
            } else {
                if (DB && region && DB[region]) {
                    let citiesToCheck = city ? [city] : Object.keys(DB[region]);
                    citiesToCheck.forEach(c => {
                        if (DB[region][c] && DB[region][c][currentTab]) DB[region][c][currentTab].forEach(i => items.push({...i, _r: region, _c: c}));
                    });
                } else if (DB && !region) {
                    for (let r in DB) {
                        for (let c in DB[r]) {
                            if (DB[r][c][currentTab]) DB[r][c][currentTab].forEach(i => items.push({...i, _r: r, _c: c}));
                        }
                    }
                }
            }

            if (searchQuery && items.length > 0) {
                items = items.filter(i => {
                    let text = ((i.specialization || '') + ' ' + (i.name || '') + ' ' + (i.type || '') + ' ' + (i._c || '')).toLowerCase();
                    return text.includes(searchQuery);
                });
                if (items.length > 0) {
                    const firstItemTab = items[0]._t;
                    if (firstItemTab && firstItemTab !== currentTab) setTab(firstItemTab);
                }
            }

            if (items.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #666; padding: 20px;">' + 
                    (searchQuery ? CFG.catalog.noResults + ' "' + searchQuery + '"' : CFG.catalog.emptyState) + '</p>';
                return;
            }

            items.forEach(item => {
                let card = document.createElement('div');
                card.className = 'card';
                let locHtml = (!city || searchQuery) ? `<span class="location">📍 ${item._r}, ${item._c}</span>` : '';
                let specHtml = item.specialization ? `<div class="spec">💼 ${item.specialization}</div>` : '';
                let contactsHtml = '';
                if (item.email) contactsHtml += `<div>✉️ ${item.email}</div>`;
                if (item.phone) contactsHtml += `<div>📞 ${item.phone}</div>`;
                if (item.reklama_phone) contactsHtml += `<div>📢 Реклама: ${item.reklama_phone}</div>`;
                let btnHtml = '';
                if (item.url) {
                    let utm = `?utm_source=ad-catalog-ru&utm_medium=catalog&utm_campaign=${item.utm || 'search'}`;
                    btnHtml = `<a href="${item.url}${utm}" target="_blank" class="btn-card">Перейти на сайт</a>`;
                } else {
                    btnHtml = `<div style="color:#999; font-size:0.85rem; margin-top:auto; text-align:center;">Сайт не указан</div>`;
                }

                card.innerHTML = `
                    ${locHtml}
                    <h3>${item.name || 'Без названия'}</h3>
                    <span class="status">${item.status || ''}</span>
                    ${specHtml}
                    <div class="contacts">
                        <div><strong>Тип:</strong> ${item.type || '-'}</div>
                        ${contactsHtml}
                    </div>
                    ${btnHtml}
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
