<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог рекламных площадок</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; color: #333; line-height: 1.5; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        h1 { margin: 0; font-size: 1.8rem; }
        .btn { background: #005bbb; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block; }
        .controls { background: #f0f8ff; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #b3d9ff; }
        .control-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        .control-group { flex: 1; min-width: 200px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; }
        select, input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; border-bottom: 1px solid #ddd; }
        .tab-btn { padding: 10px 20px; background: none; border: none; cursor: pointer; font-size: 1rem; color: #666; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: #005bbb; border-bottom-color: #005bbb; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 15px; background: white; display: flex; flex-direction: column; height: 100%; }
        .card h3 { margin-top: 0; font-size: 1.1rem; }
        .status { font-size: 0.8rem; background: #e8f5e9; color: #2e7d32; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 10px; }
        .spec { background: #f8f9fa; padding: 8px; border-radius: 4px; font-size: 0.85rem; color: #555; border-left: 3px solid #005bbb; margin: 8px 0; }
        .contacts { font-size: 0.85rem; color: #666; margin-bottom: 10px; flex-grow: 1; }
        .contacts div { margin-bottom: 3px; }
        .card .btn { width: 100%; text-align: center; box-sizing: border-box; margin-top: auto; font-size: 0.9rem; }
        .location { font-size: 0.8rem; color: #888; margin-bottom: 5px; display: block; }
        .faq { background: #fafafa; padding: 20px; border-radius: 8px; margin-top: 30px; }
        .faq h3 { color: #005bbb; font-size: 1rem; margin-bottom: 5px; }
        @media (max-width: 600px) { .control-row { flex-direction: column; } }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1>Каталог площадок</h1>
            <p style="margin: 5px 0 0 0; color: #666;">Бесплатный тест. Отчёт через 60–90 дней.</p>
        </div>
        <a href="#form" class="btn">Оставить заявку</a>
    </div>

    <div class="controls">
        <div class="control-row">
            <div class="control-group">
                <label>Область:</label>
                <select id="regionSelect"></select>
            </div>
            <div class="control-group">
                <label>Город:</label>
                <select id="citySelect" disabled></select>
            </div>
        </div>
        <div class="control-row">
            <div class="control-group">
                <label>Поиск услуг:</label>
                <input type="text" id="searchInput" placeholder="Например: табличка, SEO, газета...">
            </div>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="setTab('platforms', this)">Площадки</button>
        <button class="tab-btn" onclick="setTab('agencies', this)">Агентства</button>
    </div>

    <div id="cardsContainer" class="grid"></div>

    <div id="form" style="margin-top: 40px; text-align: center;">
        <h2>Оставить заявку</h2>
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSe8ChbFttTHq3D-BTbEJWTUYjF1aM1ezZVIo1Fas2ufZQ9qaA/viewform?embedded=true" width="100%" height="800" frameborder="0" marginheight="0" marginwidth="0">Загрузка…</iframe>
    </div>

    <div class="faq">
        <h2>Частые вопросы</h2>
        <div class="faq-item">
            <h3>Как это работает?</h3>
            <p>Мы собираем проверенные площадки и агентства. Вы можете найти партнера по ключевым словам (например, "таблички") и оставить заявку на бесплатный тест.</p>
        </div>
    </div>

    <!-- Yandex.Metrika -->
    <script type="text/javascript">
       (function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
       m[i].l=1*new Date();k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})
       (window, document, "script", "https://mc.yandex.ru/metrika/tag.js", "ym");
       ym(114270099, "init", {clickmap:true, trackLinks:true, accurateTrackBounce:true});
    </script>

    <script>
        // Глобальные переменные
        let DB = null;
        let currentTab = 'platforms';
        let searchQuery = '';

        // 1. Загрузка данных
        fetch('data.json')
            .then(res => res.json())
            .then(data => {
                DB = data;
                initFilters();
                render();
            })
            .catch(err => {
                console.error(err);
                document.getElementById('cardsContainer').innerHTML = '<p>Ошибка загрузки data.json</p>';
            });

        // 2. Инициализация фильтров
        function initFilters() {
            const regSel = document.getElementById('regionSelect');
            const citySel = document.getElementById('citySelect');
            
            // Очистка
            regSel.innerHTML = '<option value="">🔍 Все области</option>';
            citySel.innerHTML = '<option value="">🔍 Все города</option>';
            
            // Заполнение областей
            for (let region in DB) {
                let opt = document.createElement('option');
                opt.value = region;
                opt.textContent = region;
                regSel.appendChild(opt);
            }

            // События
            regSel.onchange = () => {
                updateCities(regSel.value);
                render();
            };
            
            citySel.onchange = () => {
                render();
            };

            document.getElementById('searchInput').oninput = (e) => {
                searchQuery = e.target.value.toLowerCase().trim();
                render();
            };
        }

        function updateCities(region) {
            const citySel = document.getElementById('citySelect');
            citySel.innerHTML = '<option value="">🔍 Все города</option>';
            
            if (!region || !DB[region]) {
                citySel.disabled = true;
                return;
            }
            
            citySel.disabled = false;
            for (let city in DB[region]) {
                let opt = document.createElement('option');
                opt.value = city;
                opt.textContent = city;
                citySel.appendChild(opt);
            }
        }

        function setTab(tab, btn) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render();
        }

        // 3. Главная функция отрисовки
        function render() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';
            
            const region = document.getElementById('regionSelect').value;
            const city = document.getElementById('citySelect').value;
            
            let items = [];

            // ЛОГИКА СБОРА ДАННЫХ
            if (searchQuery) {
                // ЕСЛИ ЕСТЬ ПОИСК: собираем ВСЁ (и площадки, и агентства) из ВСЕХ городов
                for (let r in DB) {
                    for (let c in DB[r]) {
                        // Добавляем площадки
                        (DB[r][c].platforms || []).forEach(i => items.push({...i, _r: r, _c: c}));
                        // Добавляем агентства
                        (DB[r][c].agencies || []).forEach(i => items.push({...i, _r: r, _c: c}));
                    }
                }
            } else {
                // ЕСЛИ НЕТ ПОИСКА: фильтруем строго по выбору
                let targetRegion = region || Object.keys(DB)[0]; // Если не выбрано, берем первую
                if (!DB[targetRegion]) return;

                let citiesToCheck = city ? [city] : Object.keys(DB[targetRegion]);
                
                citiesToCheck.forEach(c => {
                    if (DB[targetRegion][c]) {
                        let list = DB[targetRegion][c][currentTab] || [];
                        list.forEach(i => items.push({...i, _r: targetRegion, _c: c}));
                    }
                });
            }

            // ФИЛЬТРАЦИЯ ПОИСКА
            if (searchQuery) {
                items = items.filter(i => {
                    let text = (i.specialization + ' ' + i.name + ' ' + i.type + ' ' + i._c).toLowerCase();
                    return text.includes(searchQuery);
                });
            }

            // ОТРИСОВКА
            if (items.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">Ничего не найдено</p>';
                return;
            }

            items.forEach(item => {
                let card = document.createElement('div');
                card.className = 'card';
                
                // Локация (если поиск или "все города")
                let locHtml = (!city || searchQuery) ? `<span class="location">📍 ${item._r}, ${item._c}</span>` : '';
                
                // Специализация
                let specHtml = item.specialization ? `<div class="spec">💼 ${item.specialization}</div>` : '';
                
                // Контакты
                let contactsHtml = '';
                if (item.email) contactsHtml += `<div>✉️ ${item.email}</div>`;
                if (item.phone) contactsHtml += `<div>📞 ${item.phone}</div>`;
                if (item.reklama_phone) contactsHtml += `<div>📢 Реклама: ${item.reklama_phone}</div>`;
                
                // Кнопка
                let btnHtml = '';
                if (item.url) {
                    let utm = `?utm_source=ad-catalog-ru&utm_medium=catalog&utm_campaign=${item.utm || 'search'}`;
                    btnHtml = `<a href="${item.url}${utm}" target="_blank" class="btn">Перейти на сайт</a>`;
                } else {
                    btnHtml = `<div style="color:#999; font-size:0.8rem; margin-top:auto;">Сайт не указан</div>`;
                }

                card.innerHTML = `
                    ${locHtml}
                    <h3>${item.name}</h3>
                    <span class="status">${item.status}</span>
                    ${specHtml}
                    <div class="contacts">
                        <div><strong>Тип:</strong> ${item.type || '-'}</div>
                        ${contactsHtml}
                    </div>
                    ${btnHtml}
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
